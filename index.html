<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMIX DROP</title>

    <!-- Логотип снаружи сайта (на вкладке браузера) -->
    <link id="site-favicon" rel="icon" href="1000303631.jpg">

    <style>
        :root {
            --bg-page: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-soft: #f9fafb;
            --ink-black: #0b0b0c;
            --ink-dark: #18181b;
            --ink-muted: #52525b;
            --line-color: #0b0b0c;
            --line-soft: #e4e4e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-page);
            color: var(--ink-black);
            min-height: 100vh;
            padding: 24px 16px 60px;
        }

        header {
            max-width: 1140px;
            margin: 0 auto 32px;
            padding: 14px 22px;
            background: var(--bg-surface);
            border: 2px solid var(--line-color);
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            box-shadow: 0 6px 0 var(--ink-black);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Логотип внутри сайта в круглом контуре, как на картинке */
        .brand-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--line-color);
            background: #ffffff;
            display: block;
        }

        .brand {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-black);
            line-height: 1.05;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .wa-direct-btn {
            text-decoration: none;
            background: var(--bg-surface);
            color: var(--ink-black);
            border: 2px solid var(--line-color);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            transition: 0.15s ease;
        }

        .wa-direct-btn:hover {
            background: var(--ink-black);
            color: var(--bg-surface);
        }

        .cart-btn {
            background: var(--ink-black);
            color: var(--bg-surface);
            border: 2px solid var(--line-color);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 14px;
            transition: 0.15s ease;
        }

        .cart-btn:hover {
            background: var(--ink-dark);
            transform: translateY(-1px);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 22px;
            max-width: 1140px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-surface);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid var(--line-color);
            box-shadow: 0 5px 0 var(--ink-black);
            transition: transform 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card img {
            width: 100%;
            height: 245px;
            object-fit: cover;
            background: var(--bg-soft);
            border-bottom: 2px solid var(--line-color);
            display: block;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink-black);
            line-height: 1.3;
        }

        .card-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink-black);
        }

        .sizes {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin: 4px 0;
        }

        .size-btn {
            background: var(--bg-surface);
            color: var(--ink-dark);
            border: 1.5px solid var(--ink-dark);
            padding: 6px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.12s ease;
        }

        .size-btn:hover {
            background: var(--line-soft);
        }

        .size-btn.active {
            background: var(--ink-black);
            color: var(--bg-surface);
            border-color: var(--ink-black);
        }

        .add-btn {
            width: 100%;
            background: var(--ink-black);
            color: var(--bg-surface);
            border: 2px solid var(--line-color);
            padding: 11px;
            border-radius: 11px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .add-btn:hover {
            background: var(--ink-dark);
        }

        /* Блок соцсетей снизу товаров */
        .socials-footer {
            max-width: 1140px;
            margin: 42px auto 0;
            padding: 20px 22px;
            background: var(--bg-surface);
            border: 2px solid var(--line-color);
            border-radius: 18px;
            box-shadow: 0 5px 0 var(--ink-black);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .socials-label {
            font-size: 16px;
            font-weight: 900;
            color: var(--ink-black);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .socials-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-link {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            border: 2px solid var(--line-color);
            transition: 0.15s ease;
        }

        .social-tiktok {
            background: var(--bg-surface);
            color: var(--ink-black);
        }

        .social-tiktok:hover {
            background: var(--ink-black);
            color: var(--bg-surface);
        }

        .social-instagram {
            background: var(--ink-black);
            color: var(--bg-surface);
        }

        .social-instagram:hover {
            background: var(--bg-surface);
            color: var(--ink-black);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 11, 12, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 2px solid var(--line-color);
            box-shadow: 0 8px 0 var(--ink-black);
            padding: 24px;
            border-radius: 18px;
            width: 100%;
            max-width: 500px;
            max-height: 82vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 14px;
            color: var(--ink-black);
            font-weight: 900;
            text-transform: uppercase;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line-soft);
        }

        .cart-item small {
            color: var(--ink-muted);
            font-weight: 600;
        }

        .remove-btn {
            background: var(--bg-surface);
            color: var(--ink-black);
            border: 1.5px solid var(--line-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
        }

        .remove-btn:hover {
            background: var(--ink-black);
            color: var(--bg-surface);
        }

        .total {
            font-size: 20px;
            font-weight: 900;
            margin: 18px 0;
            text-align: right;
            color: var(--ink-black);
        }

        .whatsapp-btn {
            width: 100%;
            background: var(--ink-black);
            color: var(--bg-surface);
            border: 2px solid var(--line-color);
            padding: 14px;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .whatsapp-btn:hover {
            background: var(--ink-dark);
        }

        .close-btn {
            margin-top: 10px;
            width: 100%;
            background: var(--bg-surface);
            color: var(--ink-black);
            border: 2px solid var(--line-color);
            padding: 11px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 800;
        }

        .close-btn:hover {
            background: var(--line-soft);
        }
    </style>
</head>
<body>

<header>
    <div class="brand-box">
        <!-- Логотип внутри сайта -->
        <img id="header-logo" class="brand-logo" src="1000303631.jpg" alt="LAMIX DROP логотип">
        <div class="brand">LAMIX DROP</div>
    </div>
    <div class="header-actions">
        <a class="wa-direct-btn" id="header-wa-link" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <button class="cart-btn" onclick="toggleCart()">Корзина (<span id="cart-count">0</span>)</button>
    </div>
</header>

<div class="products-grid" id="products-container"></div>

<footer class="socials-footer">
    <div class="socials-label">LAMIX DROP в соцсетях:</div>
    <div class="socials-links">
        <a class="social-link social-tiktok" href="https://www.tiktok.com/@lamix.drop.kg?_r=1&_t=ZS-9Bh5PDZmtxH" target="_blank" rel="noopener">TikTok</a>
        <a class="social-link social-instagram" href="https://www.instagram.com/lamix.drop.kg?bqrl=MXQ0MW45b2ZsZXdsZA%3D%3D&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
    </div>
</footer>

<div class="modal" id="cart-modal">
    <div class="modal-content">
        <h2>Ваша корзина</h2>
        <div id="cart-items"></div>
        <div class="total">Итого: <span id="total-price">0</span> сом</div>
        <button class="whatsapp-btn" onclick="checkoutWhatsApp()">Купить через WhatsApp</button>
        <button class="close-btn" onclick="toggleCart()">Закрыть</button>
    </div>
</div>

<script>
    // Имя файла логотипа (используется внутри шапки и снаружи на вкладке браузера)
    const LOGO_IMAGE = "1000303631.jpg";
    const WHATSAPP_NUMBER = "996500099459";

    function setupLogos() {
        const candidates = [
            LOGO_IMAGE,
            "1000303631.jpg",
            "logo.jpeg",
            "logo.jpg",
            "logo.png",
            "WhatsApp Image 2026-10-09 at 15.45.55.jpeg"
        ];
        const uniqueCandidates = [...new Set(candidates)];

        const headerImg = document.getElementById("header-logo");
        const faviconLink = document.getElementById("site-favicon");

        function tryLoad(index) {
            if (index >= uniqueCandidates.length) return;
            const candidate = uniqueCandidates[index];
            const encoded = encodeURI(candidate);
            const testImg = new Image();

            testImg.onload = () => {
                const finalSrc = `${encoded}?v=${Date.now()}`;
                headerImg.src = finalSrc;
                faviconLink.href = finalSrc;
            };
            testImg.onerror = () => {
                tryLoad(index + 1);
            };
            testImg.src = encoded;
        }

        tryLoad(0);
    }

    setupLogos();

    document.getElementById("header-wa-link").href =
        `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Здравствуйте! Пишу с сайта LAMIX DROP.")}`;

    let products = [];
    let cart = [];

    async function loadProducts() {
        try {
            const response = await fetch("products.json?t=" + Date.now());
            products = await response.json();
            renderProducts();
        } catch (error) {
            console.error("Ошибка загрузки товаров:", error);
        }
    }

    function renderProducts() {
        const container = document.getElementById("products-container");
        container.innerHTML = "";

        products.forEach((product, index) => {
            const sizesList = Array.isArray(product.sizes) && product.sizes.length ? product.sizes : ["Стандарт"];
            const sizesHtml = sizesList.map((size, sIndex) =>
                `<button class="size-btn ${sIndex === 0 ? "active" : ""}" onclick="selectSize(this, ${index}, '${size}')">${size}</button>`
            ).join("");

            container.innerHTML += `
                <div class="card" id="product-${index}" data-selected-size="${sizesList[0]}">
                    <img src="${product.image}" alt="${product.name}">
                    <div class="card-body">
                        <div class="card-title">${product.name}</div>
                        <div class="card-price">${product.price} сом</div>
                        <div class="sizes">${sizesHtml}</div>
                        <button class="add-btn" onclick="addToCart(${index})">В корзину</button>
                    </div>
                </div>
            `;
        });
    }

    function selectSize(btn, productIndex, size) {
        const card = document.getElementById(`product-${productIndex}`);
        card.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        card.setAttribute("data-selected-size", size);
    }

    function addToCart(productIndex) {
        const card = document.getElementById(`product-${productIndex}`);
        const selectedSize = card.getAttribute("data-selected-size");
        const product = products[productIndex];

        cart.push({
            name: product.name,
            price: Number(product.price),
            size: selectedSize
        });
        updateCartUI();
    }

    function removeFromCart(cartIndex) {
        cart.splice(cartIndex, 1);
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById("cart-count").innerText = cart.length;
        const itemsContainer = document.getElementById("cart-items");
        itemsContainer.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
            itemsContainer.innerHTML = `<p style="color:#52525b;padding:10px 0;font-weight:600;">Корзина пока пуста</p>`;
        }

        cart.forEach((item, index) => {
            total += item.price;
            itemsContainer.innerHTML += `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>Размер: ${item.size} • ${item.price} сом</small>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">✕</button>
                </div>
            `;
        });

        document.getElementById("total-price").innerText = total;
    }

    function toggleCart() {
        const modal = document.getElementById("cart-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function checkoutWhatsApp() {
        if (cart.length === 0) {
            alert("Корзина пуста!");
            return;
        }

        let message = "Здравствуйте! Хочу оформить заказ в LAMIX DROP:\n\n";
        let total = 0;

        cart.forEach((item, i) => {
            message += `${i + 1}. ${item.name} — Размер: ${item.size} (${item.price} сом)\n`;
            total += item.price;
        });

        message += `\nИтого к оплате: ${total} сом`;

        const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
    }

    updateCartUI();
    loadProducts();
</script>
</body>
</html>
